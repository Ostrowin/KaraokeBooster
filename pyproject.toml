[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaokebooster"
version = "0.1.0"
description = "Korekcja wysokości głosu do melodii piosenki (UltraStar) na pokaz karaoke"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mido>=1.3",
    "python-osc>=1.8",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchaudio",
    "demucs>=4.0",
    "torchcrepe>=0.0.22",
]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["karaokebooster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
